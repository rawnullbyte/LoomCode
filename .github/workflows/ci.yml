name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Docs site (generated from the repository Markdown)
        run: python3 docs/site/build.py --check
      - name: Build release
        run: cargo build --release
      - name: Smoke test (offline, mock provider)
        run: |
          export LOON_HOME=$(mktemp -d)
          ./target/release/loom doctor
          ./target/release/loom run "smoke" --output jsonl | grep -q '"type":"turn"'
          ./target/release/loom sessions list
          ./target/release/loom config validate
