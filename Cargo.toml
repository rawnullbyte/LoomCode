[workspace]
resolver = "2"
members = [
    "crates/loon-events",
    "crates/loon-config",
    "crates/loon-workspace",
    "crates/loon-tools",
    "crates/loon-providers",
    "crates/loon-core",
    "crates/loon-tui",
    "crates/loon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
loon-events = { path = "crates/loon-events" }
loon-config = { path = "crates/loon-config" }
loon-workspace = { path = "crates/loon-workspace" }
loon-tools = { path = "crates/loon-tools" }
loon-providers = { path = "crates/loon-providers" }
loon-core = { path = "crates/loon-core" }
loon-tui = { path = "crates/loon-tui" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
glob = "0.3"
rand = "0.8"
ignore = "0.4"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }

# dev
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
