<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="loomLogoTitle loomLogoDesc">
  <title id="loomLogoTitle">Loom</title>
  <desc id="loomLogoDesc">A loom frame with warp threads drawn through it in the Loom gradient.</desc>
  <defs>
    <linearGradient id="loomWarp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5bdac8"/>
      <stop offset="45%" stop-color="#78bce1"/>
      <stop offset="100%" stop-color="#bc9bf6"/>
    </linearGradient>
    <linearGradient id="loomFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ee7dd"/>
      <stop offset="100%" stop-color="#bc9bf6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0e1c28"/>

  <!-- Frame: the warp beam above, the cloth beam below, two uprights. -->
  <g fill="none" stroke="url(#loomFrame)" stroke-linecap="round" stroke-width="18">
    <path d="M136 132h240"/>
    <path d="M136 380h240"/>
    <path d="M152 132v248"/>
    <path d="M360 132v248"/>
  </g>

  <!-- Warp threads: taut verticals the weft crosses. -->
  <g stroke="url(#loomWarp)" stroke-linecap="round" stroke-width="13" opacity="0.92">
    <path d="M196 158v224"/>
    <path d="M256 158v224"/>
    <path d="M316 158v224"/>
  </g>

  <!-- Weft: the single strand being drawn through, the reason the frame exists. -->
  <path d="M152 256c34-30 69-30 104 0s70 30 104 0" fill="none" stroke="url(#loomWarp)" stroke-linecap="round" stroke-width="20"/>

  <!-- Shuttle glint at the working edge. -->
  <circle cx="256" cy="256" r="15" fill="#0e1c28"/>
  <circle cx="256" cy="256" r="9" fill="#eaf7ff"/>
</svg>
