[package]
name = "loon-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loon-workspace.workspace = true
loon-events.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
glob.workspace = true
ignore.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
# In-process Rust parsing for the symbol table and syntax diagnostics: real AST
# navigation with no language server to install. `syn` is already in the tree
# transitively, so this adds no new resolution work.
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
# syn re-exports spans from proc-macro2; positions come from there. `span-locations`
# makes Span::start()/end() report real offsets in the parsed source.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Rendering non-path types back to text (impl receivers like `&Foo`).
quote = "1"
# TOML syntax diagnostics reuse the config parser already in the tree.
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
